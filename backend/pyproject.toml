[project]
name = "finviz-dashboard-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pandas>=2.2",
    "requests>=2.32",
    "pydantic-settings>=2.6",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "httpx>=0.27",
    "responses>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
